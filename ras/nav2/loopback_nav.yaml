# Milestone A — end-to-end NavigateToPose on a static map, driven by the
# nav2_loopback_sim kinematic simulator. No physics engine, no GPU, no AMCL.
#
# Derived from nav2_bringup 1.3.11 params/nav2_params.yaml. Values differing from
# upstream carry their default and the reason. Bond is disabled throughout for the
# reason documented in planner_only.yaml.
#
# SPDX-License-Identifier: Apache-2.0
# Copyright (C) 2026 Chungbuk National University, Computer Systems Lab

map_server:
  ros__parameters:
    use_sim_time: false
    bond_heartbeat_period: 0.0
    topic_name: "map"
    frame_id: "map"

# --------------------------------------------------------------------------
# loopback_simulator — consumes /cmd_vel, publishes map->odom, odom->base_link,
# /odom and a raycast /scan. Source: nav2_loopback_sim (built from source; the
# riscv64 repo does not package it).
# --------------------------------------------------------------------------
loopback_simulator:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"       # upstream "base_footprint". Using base_link
                                     # directly removes the need for a URDF and
                                     # robot_state_publisher, which would drag in
                                     # the whole ros-gz chain via nav2-minimal-tb3-sim.
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan"       # requires a static base_link -> base_scan TF,
                                     # or getBaseToLaserTf() logs a lookup failure
    publish_map_odom_tf: true

    publish_clock: false             # upstream true. The node relays /clock from a
                                     # 10 Hz wall-clock timer. It is a pure relay
                                     # that buys nothing here, and it is a single
                                     # point of failure: starve that one Python
                                     # timer under TCG and every node's clock
                                     # freezes, deadlocking the whole stack.

    update_duration: 0.1             # upstream 0.01 (100 Hz). CRITICAL: the node
                                     # integrates with a FIXED dt equal to this
                                     # parameter, not elapsed time:
                                     #     dx = curr_cmd_vel.linear.x * update_dur
                                     # If it cannot sustain the rate, the robot
                                     # moves proportionally slower than commanded
                                     # in wall time, and SimpleProgressChecker
                                     # aborts the goal with "failed to make
                                     # progress". 100 Hz is unreachable under TCG;
                                     # 10 Hz is, and restores the intended speed.

    # The scan is a pure-Python raycast over the occupancy grid and is the single
    # largest CPU consumer in this stack. Nothing consumes it here (the costmaps
    # use static_layer), so make it cheap rather than removing it.
    scan_publish_dur: 1.0            # upstream 0.1
    scan_angle_increment: 0.15       # upstream 0.0261 -> 240 rays becomes 42
    scan_range_max: 6.0              # upstream 30.0
    scan_use_inf: true

# --------------------------------------------------------------------------
planner_server:
  ros__parameters:
    use_sim_time: false
    bond_heartbeat_period: 0.0
    expected_planner_frequency: 1.0  # upstream 20.0
    costmap_update_timeout: 30.0     # upstream 1.0
    action_server_result_timeout: 900.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

controller_server:
  ros__parameters:
    use_sim_time: false
    bond_heartbeat_period: 0.0
    controller_frequency: 5.0        # upstream 20.0 — unreachable under TCG, and
                                     # missing it aborts with "control loop missed
                                     # its desired rate"
    costmap_update_timeout: 30.0     # upstream 0.30
    action_server_result_timeout: 900.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 120.0 # upstream 10.0 — see update_duration above
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # Upstream FollowPath is DWB, which rolls out and scores a trajectory set every
    # control cycle. Regulated Pure Pursuit does no sampling at all — it picks a
    # lookahead point and solves for curvature. On a static map with a valid global
    # plan it is entirely adequate, and it is the difference between hitting 5 Hz
    # under emulation and not.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 5.0       # upstream 0.1
      use_collision_detection: false # the local costmap has no live sensor layer
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2

behavior_server:
  ros__parameters:
    use_sim_time: false
    bond_heartbeat_period: 0.0
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 5.0         # upstream 0.1
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"

bt_navigator:
  ros__parameters:
    use_sim_time: false
    bond_heartbeat_period: 0.0
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 100            # upstream 10 ms
    default_server_timeout: 120      # upstream 20
    wait_for_service_timeout: 30000  # upstream 1000 ms — node discovery at startup
                                     # is slow under emulation
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

# --------------------------------------------------------------------------
# Both costmaps use static_layer only. Upstream global uses obstacle_layer and
# local uses voxel_layer, both fed by /scan. Here the world IS the static map and
# the loopback scan is a raycast of that same map, so static_layer carries
# identical information at zero CPU cost — and removes a starvation failure mode.
# --------------------------------------------------------------------------
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      update_frequency: 0.5          # upstream 1.0
      publish_frequency: 0.0         # upstream 1.0 — nothing consumes it, no rviz2
      transform_tolerance: 5.0
      initial_transform_timeout: 300.0
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
      always_send_full_costmap: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      robot_radius: 0.22
      resolution: 0.05
      rolling_window: true
      width: 3
      height: 3
      update_frequency: 2.0          # upstream 5.0
      publish_frequency: 0.0         # upstream 2.0
      transform_tolerance: 5.0
      initial_transform_timeout: 300.0
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

lifecycle_manager_nav:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ["map_server", "planner_server", "controller_server",
                 "behavior_server", "bt_navigator"]
    bond_timeout: 0.0                # disabled — see planner_only.yaml
    attempt_respawn_reconnection: false

# Nav2 parameters for the guest side of the split topology.
#
# Starting point is ras/nav2/loopback_nav.yaml, which is already retuned for TCG
# and validated by Milestone A. Comments here mark only what changed *relative to
# that file*; the TCG retunings it established are carried over unchanged and
# their justification stays in loopback_nav.yaml so it is stated once.
#
# Four differences from the loopback rig, all consequences of the split:
#   1. use_sim_time: true everywhere      -- Gazebo publishes /clock via the bridge
#   2. robot_base_frame: base_footprint   -- Gazebo's TB3 SDF roots there
#   3. obstacle_layer enabled             -- there is a real /scan now
#   4. no map_server, no amcl             -- slam_toolbox provides /map and map->odom
#
# WARNING about (1): use_sim_time does NOT make a low real-time factor harmless.
# bondcpp uses create_wall_timer with RCL_STEADY_TIME, and controller_server and
# behavior_tree_engine use rclcpp::WallRate. At real-time factor R the effective
# control period inflates by 1/R while the "control loop missed its rate" warning
# goes silent. Any functional result here must be reproduced at two different
# real-time factors before it is believed.

planner_server:
  ros__parameters:
    use_sim_time: true
    bond_heartbeat_period: 0.0
    expected_planner_frequency: 1.0
    costmap_update_timeout: 30.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

controller_server:
  ros__parameters:
    use_sim_time: true
    bond_heartbeat_period: 0.0
    controller_frequency: 5.0
    costmap_update_timeout: 30.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 120.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 6.28
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 5.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2

behavior_server:
  ros__parameters:
    use_sim_time: true
    bond_heartbeat_period: 0.0
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 5.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"

bt_navigator:
  ros__parameters:
    use_sim_time: true
    bond_heartbeat_period: 0.0
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    transform_tolerance: 5.0
    # 10 ms is upstream's default and it starves this node's own clock on an
    # emulated guest. bt_navigator ticks its tree on an rclcpp::WallRate at this
    # period, so 10 ms asks for 100 ticks per second; under TCG the executor then
    # almost never gets round to the /clock callback, and the node's notion of time
    # crawls. Measured 2026-08-17 in the split run, with a 5 Hz clock on the wire
    # and planner_server showing no extrapolation errors at all, bt_navigator alone
    # sat 42 s behind the TF stamps and aborted every goal with
    #   [bt_navigator]: Initial robot pose is not available.
    # 200 ms still replans far faster than this robot moves (0.26 m/s, so 5 cm per
    # tick) and leaves the executor time to service the clock.
    bt_loop_duration: 200
    # NOT "". An empty string is not "use the default" -- bt_navigator loads
    # nothing, and every goal is aborted in 0 s with
    #   [BehaviorTreeEngine] Behavior tree threw exception: Empty Tree
    #   [bt_navigator] Goal failed
    # which looks like a planning failure and is not. Named explicitly rather
    # than omitted, so the report can say which tree drove the robot. Same path
    # on both architectures.
    default_nav_to_pose_bt_xml: /opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml
    goal_blackboard_id: goal
    path_blackboard_id: path
    # How long a BT action node waits for an action server to ACKNOWLEDGE a goal
    # -- not to complete it. Upstream is 20 ms, which is a local-machine number.
    # Measured here 2026-08-19: planner_server did not acknowledge within 20 ms,
    # every goal aborted ~140 ms after it arrived, and the log said
    #   [bt_navigator_navigate_to_pose_rclcpp_node] Timed out while waiting for
    #   action server to acknowledge goal request for compute_path_to_pose
    #   [bt_navigator] Goal failed
    # with NO message from planner_server at all -- it was never asked. The robot
    # sat at (0,0) and the run read as a planning failure, which it was not.
    # ../../nav2/loopback_nav.yaml already carried 120 ms for the guest-local
    # case; this path adds a TCP link and a loaded guest on top, so it is larger.
    # A generous value costs nothing when the server is healthy: it is a ceiling,
    # not a delay.
    default_server_timeout: 5000
    # Upstream 1000 ms. Node discovery under TCG took 16 s for navigate_to_pose
    # in the same run, and this is the same class of wait.
    wait_for_service_timeout: 30000
    # Upstream 10 s, after which a result the client has not collected is
    # discarded. One waypoint leg at RTF 0.5 can exceed that.
    action_server_result_timeout: 900.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      update_frequency: 0.5
      # 1.0 is upstream's value and it is not optional. publish_frequency 0.0
      # stops Costmap2DROS publishing costmap_raw at all, and behavior_server
      # reaches its costmap only through nav2_costmap_2d::CostmapSubscriber on
      # that topic. With 0.0 every recovery aborts with `Costmap is not
      # available` from libnav2_costmap_2d_client.so -- observed 2026-08-17 in
      # G2b, where 6 recoveries failed that way and the run ended 1/2. It stayed
      # invisible in G2 only because nothing there ever needed a recovery.
      # It does cost CPU, which G6 has to account for.
      publish_frequency: 1.0
      transform_tolerance: 5.0
      initial_transform_timeout: 300.0
      # obstacle_layer added: with a real gpu_lidar behind /scan, the reason it
      # was excluded from the loopback rig (no scan source, so the costmap never
      # became current) no longer applies.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # slam_toolbox publishes /map TRANSIENT_LOCAL; a volatile subscription
        # never matches it and the layer would stay empty forever.
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          # 8.0 to match max_laser_range in mapper_params_tcg.yaml, so the
          # costmap and the SLAM graph agree on what counts as a return.
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
          raytrace_max_range: 8.5
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      robot_radius: 0.22
      resolution: 0.05
      rolling_window: true
      width: 3
      height: 3
      update_frequency: 2.0
      # 2.0 is upstream's value. This is the topic behavior_server actually
      # subscribes to (local_costmap/costmap_raw is its default
      # local_costmap_topic), so this is the one that made recoveries fail. See
      # the global costmap above for the observation.
      publish_frequency: 2.0
      transform_tolerance: 5.0
      initial_transform_timeout: 300.0
      # static_layer dropped here: a rolling local window fed by a live SLAM map
      # double-counts the same walls the obstacle_layer already sees, and the
      # static layer has to be recopied on every SLAM map update.
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
          raytrace_max_range: 8.5
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

lifecycle_manager_nav:
  ros__parameters:
    use_sim_time: true
    autostart: true
    # slam_toolbox is FIRST and it is not optional. async_slam_toolbox_node in
    # Jazzy is an rclcpp_lifecycle::LifecycleNode with no self-activation and no
    # use_lifecycle_manager parameter: launched and left alone it sits in
    # `unconfigured` forever, printing only "Node using stack size" and nothing
    # else. It then never subscribes to /scan and never broadcasts map->odom, so
    # every costmap logs `Invalid frame ID "map" ... frame does not exist` twice a
    # second and lifecycle_manager never reaches "Managed nodes are active".
    # Verified with `ros2 lifecycle get /slam_toolbox` -> unconfigured.
    # nav2_bringup does the same thing in slam_launch.py, under a separate
    # lifecycle_manager_slam.
    #
    # First in the list because the manager transitions node_names in order, and
    # the costmaps' activation blocks until the map frame they need exists.
    #
    # Safe only because bond_timeout is 0.0 below: slam_toolbox derives from
    # rclcpp_lifecycle::LifecycleNode rather than nav2_util::LifecycleNode, so it
    # creates no bond for the manager to wait on.
    node_names:
      - slam_toolbox
      - planner_server
      - controller_server
      - behavior_server
      - bt_navigator
    bond_timeout: 0.0
